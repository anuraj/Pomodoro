<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color-meta" name="theme-color" content="#0b1220" />
    <meta name="description" content="Pomodoro timer for focused work sessions and short breaks" />
    <title>Pomodoro Timer</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="pomodoro-card" aria-label="Pomodoro timer panel">
        <header class="timer-header">
          <span class="app-title">Pomodoro</span>
          <button id="settings-button" class="settings-button" type="button" aria-label="Open settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.09A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.57 15 1.7 1.7 0 0 0 3 14H3v-4h.09A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.57 1.7 1.7 0 0 0 10 3h4v.09a1.7 1.7 0 0 0 1.06 1.51 1.7 1.7 0 0 0 1.88-.34L17 4.2 19.83 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 21 10h.09v4H21a1.7 1.7 0 0 0-1.6 1Z" />
            </svg>
          </button>
        </header>

        <section class="timer-workspace" aria-label="Pomodoro timer workspace">
          <div class="timer-wrap">
            <svg class="progress-ring" viewBox="0 0 220 220" aria-hidden="true">
              <circle class="ring-bg" cx="110" cy="110" r="88"></circle>
              <circle id="progress-circle" class="ring-progress" cx="110" cy="110" r="88"></circle>
            </svg>

            <div class="timer-digit-wrap" aria-live="polite" aria-atomic="true">
              <div id="timer-display" class="timer-display">25:00</div>
              <span id="timer-mode" class="mode-badge">Work</span>
            </div>
          </div>

          <div class="controls" aria-label="Timer controls">
            <button id="start-btn" class="control-btn control-primary" aria-label="Start timer" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            </button>
            <button id="pause-btn" class="control-btn pause-btn" aria-label="Pause timer" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 5.25h3.5v13.5H7zm6.5 0H17v13.5h-3.5z" />
              </svg>
            </button>
            <button id="reset-btn" class="control-btn" aria-label="Reset timer" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8.3" />
                <path d="M3 3v5.3h5.3" />
              </svg>
            </button>
          </div>

          <div class="focus-note-field">
            <label for="focus-note">Focus note <span>(optional)</span></label>
            <input id="focus-note" name="focus-note" type="text" maxlength="24" autocomplete="off" placeholder="What are you focusing on?" />
          </div>
        </section>

        <div class="dashboard-workspace">
          <section class="stats-panel" aria-label="Pomodoro statistics dashboard">
            <div class="stats-header">
              <h2>Statistics</h2>
            </div>

          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">7-day focus</span>
              <strong id="stats-week-total" class="stat-value">0</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Avg. session</span>
              <strong id="stats-average-duration" class="stat-value">No data</strong>
            </div>
            <div class="stat-card">
              <span class="stat-label">Current streak</span>
              <strong id="stats-current-streak" class="stat-value">0 days</strong>
            </div>
          </div>

          <div
            id="stats-chart"
            class="stats-chart"
            role="img"
            aria-label="Seven-day Pomodoro chart"
            aria-describedby="stats-chart-summary"
          ></div>
          <p id="stats-chart-summary" class="sr-only" aria-live="polite">
            Seven-day Pomodoro activity chart. No completed sessions yet.
          </p>
          </section>

          <section class="history-panel" aria-label="Completed sessions history">
            <div class="history-header">
              <h2>History</h2>
            </div>
            <ul id="history-list" class="history-list" aria-live="polite"></ul>
          </section>
        </div>
      </section>
    </main>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" class="settings-form" method="dialog" novalidate>
        <div class="settings-header">
          <div>
            <span class="settings-eyebrow">Preferences</span>
            <h2 id="settings-title">Settings</h2>
          </div>
          <button id="settings-close" class="icon-button" type="button" aria-label="Close settings" title="Close settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>

        <p id="settings-error" class="settings-error" role="alert" aria-live="assertive"></p>

        <fieldset class="settings-group">
          <legend>Timer</legend>
          <div class="settings-grid">
            <label class="settings-field" for="focus-minutes">
              <span>Focus time</span>
              <span class="number-control">
                <input id="focus-minutes" name="focusMinutes" type="number" min="1" max="120" step="1" inputmode="numeric" required />
                <span aria-hidden="true">min</span>
              </span>
            </label>
            <label class="settings-field" for="break-minutes">
              <span>Break time</span>
              <span class="number-control">
                <input id="break-minutes" name="breakMinutes" type="number" min="1" max="120" step="1" inputmode="numeric" required />
                <span aria-hidden="true">min</span>
              </span>
            </label>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>Session colors</legend>
          <div class="settings-grid">
            <label class="settings-field color-field" for="work-color">
              <span>Focus accent</span>
              <input id="work-color" name="workColor" type="color" />
            </label>
            <label class="settings-field color-field" for="break-color">
              <span>Break accent</span>
              <input id="break-color" name="breakColor" type="color" />
            </label>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>Appearance</legend>
          <div class="theme-options">
            <label><input type="radio" name="theme" value="light" /> <span>Light</span></label>
            <label><input type="radio" name="theme" value="dark" /> <span>Dark</span></label>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>Alerts</legend>
          <label class="toggle-row" for="notifications-enabled">
            <span>
              <strong>Browser notifications</strong>
              <small id="notification-status">Notifications off</small>
            </span>
            <input id="notifications-enabled" name="notificationsEnabled" type="checkbox" />
          </label>
        </fieldset>

        <div class="settings-actions">
          <button id="settings-cancel" class="settings-action settings-cancel" type="button">Cancel</button>
          <button class="settings-action settings-save" type="submit">Save settings</button>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
